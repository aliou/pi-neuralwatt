name: Pricing sync

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      # Route the live /v1/quota cross-check through the Aperture neuralwatt
      # connector, which injects credentials server-side; the check is keyless.
      # The public-source checks always run direct and do not use this.
      NEURALWATT_API_BASE_URL: http://aperture-qa/v1/connectors/neuralwatt
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check plan pricing against public sources
        id: check
        run: |
          set +e
          pnpm exec tsx scripts/check-pricing.ts > drift-report.md
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          cat drift-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "----"
          cat drift-report.md

      - name: Fail the run when the check could not run
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "check:pricing could not run (network/HTTP/unexpected error)." >&2
          exit 1

      - name: Open an issue on drift
        if: steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="pricing-sync"

          existing_count=$(gh issue list \
            --label "$label" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$existing_count" -gt 0 ]; then
            echo "An open $label issue already exists. Skipping."
            exit 0
          fi

          gh label create "$label" --color "FBCA04" \
            --description "Neuralwatt plan pricing drift" || true

          gh issue create \
            --label "$label" \
            --title "[pricing-sync] Neuralwatt plan pricing drift ($(date -u +%Y-%m-%d))" \
            --body-file drift-report.md
